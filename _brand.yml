meta:
  name:
    full: "Oldham Lab"
    short: "Oldham Lab"
  link:
    home: https://oldhamlab.org
    github: https://github.com/oldhamlab

# Mark only. The "Oldham Lab" wordmark is rendered by Quarto as navbar text so
# it uses the real brand font rather than baking type into an SVG.
logo:
  images:
    mark-light:
      path: img/logo-mark.svg
      alt: "Oldham Lab"
    mark-dark:
      path: img/logo-mark-dark.svg
      alt: "Oldham Lab"
  small:
    light: mark-light
    dark: mark-dark
  medium:
    light: mark-light
    dark: mark-dark

color:
  palette:
    # Steel ramp. steel-500 is the site's existing brand blue, preserved exactly.
    steel-50: "#F2F6FA"
    steel-100: "#E1EBF4"
    steel-200: "#C3D6E8"
    steel-300: "#9CBBD7"
    steel-400: "#729BC2"
    steel-500: "#4E79A6"
    steel-600: "#3C6089"
    steel-700: "#2F4B6B"
    steel-800: "#24384F"
    steel-900: "#1A2938"
    # Copper accent - warm complement that stays legible in both modes.
    copper-300: "#EFC199"
    copper-400: "#E39B5F"
    copper-600: "#B4622E"
    copper-700: "#8F4C22"
    # Neutrals
    ink: "#111820"
    paper: "#FFFFFF"
    night: "#12181F"
    night-alt: "#1A222C"
    mist: "#E6EAEF"
    graphite: "#3A4553"

  foreground:
    light: ink
    dark: "#E4E9EF"
  background:
    light: paper
    dark: night
  primary:
    light: steel-600
    dark: steel-300
  secondary:
    light: graphite
    dark: mist
  tertiary:
    light: steel-100
    dark: night-alt
  link:
    light: steel-700
    dark: steel-300
  info: steel-500
  success: "#2E7D5B"
  warning: copper-600
  danger: "#B3261E"
  light: steel-50
  dark: steel-900

typography:
  fonts:
    - family: Source Serif 4
      source: google
      weight: [400, 600, 700]
      style: [normal, italic]
    - family: Source Sans 3
      source: google
      weight: [400, 600, 700]
      style: [normal, italic]
    - family: Source Code Pro
      source: google
      weight: [400, 600]
  base:
    family: Source Sans 3
    size: 1.0625rem
    line-height: 1.65
    weight: 400
  headings:
    family: Source Serif 4
    weight: 600
    line-height: 1.2
  monospace:
    family: Source Code Pro
    size: 0.9em
  link:
    weight: 500
    decoration: underline
