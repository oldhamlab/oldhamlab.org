# Hand-maintained additions to the publication list.
#
# tools/update-papers.py OVERWRITES papers.yml on every run. This file is never
# written to, so anything editorial belongs here.
#
# Two kinds of entry:
#
#   1. A `doi:` with no title -- a seed (pull this paper in) or an annotation
#      (attach an award or commentary to it). Metadata comes from Crossref.
#        award:  a prize or selection    -> printed after the entry
#        note:   accompanying commentary -> printed after the entry; repeat the
#                key for more than one, each gets its own line
#        drop:   suppress the entry entirely
#
#   2. An entry with a `title:` -- a complete record, used as-is with no
#      Crossref lookup. Book chapters need this: they have no DOI.
#        author, editors, journal (the book), edition, place, publisher,
#        date, pages
#
# Source of truth is the CV at
# ~/nas/Lab/admin_career/cv/2026-07-27_oldham_cv.docx.

