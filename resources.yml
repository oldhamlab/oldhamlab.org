# Software and data the lab publishes. Hand-maintained.
#
#   kind:    software | compendium     -- which section it appears under
#   url:     where it lives
#   paper:   optional DOI of the paper it supports
#   project: optional research-page slug, for surfacing on that page later
#
# Deliberately excluded:
#   - forks of other people's packages (multiGSEA, IsoCorrectoR, rbbt)
#   - repositories whose GitHub description is still the package-skeleton
#     placeholder (wmo, paprpkgr) or that are personal (tackle,
#     peloton-to-garmin, tidytuesday, R-setup)
#
# mzrtools' GitHub blurb is still the placeholder, but its DESCRIPTION is
# written and the package is cited by the eLife paper; the text below comes
# from DESCRIPTION, not from the repo blurb.
# Add any of those here once they have a description worth publishing.

# ── Software ──────────────────────────────────────────────────────────
- title: "paramounter"
  kind: software
  text: "Measures LC–MS processing parameters directly from the data, rather
    than tuning them by hand."
  url: "https://github.com/wmoldham/paramounter"

- title: "mzrtools"
  kind: software
  text: "Turns molecular formulas into the values mass spectrometry needs:
    monoisotopic masses, targeted libraries, isotope enumeration and
    probability distributions, and correction for natural isotope abundance."
  url: "https://github.com/wmoldham/mzrtools"

# ── Data and analysis compendia ───────────────────────────────────────
