project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "people/*.qmd"
    - "research/*.qmd"
    - "!**/_template.qmd"
  preview:
    port: 4200
    browser: false
  # Self-hosted webfonts are not referenced from any .qmd, so Quarto will not
  # discover them - they must be declared as project resources or the site
  # ships with no fonts at all.
  resources:
    - fonts/

website:
  title: "Oldham Lab"
  description: >-
    Cell metabolism in pulmonary hypertension and pulmonary fibrosis.
    Brown University and Brown University Health.
  site-url: "https://oldhamlab.org"
  repo-url: "https://github.com/oldhamlab/oldhamlab.org"
  image: img/cells.jpg
  open-graph: true
  # Card kept so shared links still get a large preview image, but no
  # `creator:` attribution - the account is no longer used.
  twitter-card:
    card-style: summary_large_image
  google-analytics:
    tracking-id: "G-KZ6PJ54VTV"
    anonymize-ip: true
  # NOTE: Quarto 1.9 changed the default to `express` (opt-in, blocks cookies
  # until consent). `implied` preserves the behaviour this site had on 1.2 so
  # the toolchain upgrade doesn't silently change analytics. Switch to
  # `express` if you'd rather have opt-in consent.
  cookie-consent:
    type: implied
    style: simple
    palette: light
  search:
    location: navbar
    type: overlay
  page-navigation: false

  navbar:
    # An explicit hex is what stops Quarto painting the navbar with $primary.
    # Without it you get a full-bleed coloured slab regardless of the SCSS.
    # (`body` is not accepted here - the schema wants a named or hex colour.)
    background: "#fdfcfb"
    title: "Oldham Lab"
    collapse-below: lg
    left:
      - research.qmd
      - people.qmd
      - papers.qmd
      - contact.qmd
    # Scholarly IDs live here as icons rather than as footer links.
    right:
      - icon: mortarboard-fill
        href: https://scholar.google.com/citations?user=cba3bIAAAAAJ&hl=en
        aria-label: "Google Scholar"
      - icon: person-badge
        href: https://orcid.org/0000-0003-3029-4866
        aria-label: "ORCID"
      - icon: github
        href: https://github.com/oldhamlab
        aria-label: "GitHub"

  # No page-footer. The only thing that has to appear at the bottom is the
  # cookie-consent control, which Quarto injects on its own.

format:
  html:
    theme: custom.scss
    toc: false
    # Off: adds a hover glyph to every heading, and nests an anchor link
    # inside teaser headings that are already links.
    anchor-sections: false
    smooth-scroll: true
    link-external-newwindow: true
    link-external-icon: false
    grid:
      body-width: 1120px
      sidebar-width: 240px
      margin-width: 180px
      gutter-width: 1.5rem
