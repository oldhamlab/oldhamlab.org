project:
  type: website
  output-dir: _site
  # Do NOT add pre-render/post-render hooks. Netlify builds this site on every
  # push (netlify.toml) and its image has Python, so a hook would run
  # tools/update-papers.py in CI -- hitting ORCID and Crossref on each build and
  # publishing a papers.yml that disagrees with the repo. Regenerate locally and
  # commit the result instead.
  render:
    - "*.qmd"
    - "people/*.qmd"
    - "research/*.qmd"
    - "!**/_template.qmd"
  preview:
    port: 4200
    browser: false
  # Self-hosted webfonts are not referenced from any .qmd, so Quarto will not
  # discover them - they must be declared as project resources or the site
  # ships with no fonts at all.
  resources:
    - fonts/

website:
  title: "Oldham Lab"
  description: >-
    Cell metabolism in pulmonary hypertension and pulmonary fibrosis.
    Brown University and Brown University Health.
  site-url: "https://oldhamlab.org"
  repo-url: "https://github.com/oldhamlab/oldhamlab.org"
  image: img/cells.jpg
  open-graph: true
  # Card kept so shared links still get a large preview image, but no
  # `creator:` attribution - the account is no longer used.
  twitter-card:
    card-style: summary_large_image
  # No analytics, deliberately. The site sets no cookies, so there is no consent
  # banner and nothing to consent to. The only third-party request left is the
  # Google Maps iframe on the contact page, which is there on purpose.
  #
  # Adding `google-analytics:` back would also bring back the cookie-consent
  # banner - Quarto emits the two together, they are not separable. If visitor
  # numbers are ever wanted, prefer a cookieless option (Netlify's server-side
  # Analytics, or a beacon such as Cloudflare Web Analytics) so the banner does
  # not return.
  search:
    location: navbar
    type: overlay
  page-navigation: false

  navbar:
    # An explicit hex is what stops Quarto painting the navbar with $primary.
    # Without it you get a full-bleed coloured slab regardless of the SCSS.
    # (`body` is not accepted here - the schema wants a named or hex colour.)
    background: "#fdfcfb"
    title: "Oldham Lab"
    collapse-below: lg
    left:
      - research.qmd
      - people.qmd
      - papers.qmd
      - funding.qmd
      - news.qmd
      - resources.qmd
      - contact.qmd
    # Scholarly IDs live here as icons rather than as footer links.
    right:
      - icon: mortarboard-fill
        href: https://scholar.google.com/citations?user=cba3bIAAAAAJ&hl=en
        aria-label: "Google Scholar"
      - icon: person-badge
        href: https://orcid.org/0000-0003-3029-4866
        aria-label: "ORCID"
      - icon: github
        href: https://github.com/oldhamlab
        aria-label: "GitHub"

  # No page-footer, and with analytics removed there is no cookie-consent
  # control either, so Quarto emits no <footer> at all.

format:
  html:
    theme: custom.scss
    toc: false
    # No math anywhere on this site, but Quarto loads MathJax from jsDelivr and
    # an ES6 polyfill from cdnjs on every page regardless. Both send visitor IPs
    # to a third party -- the same reason the fonts are self-hosted -- and the
    # polyfill is pointless in current browsers. `plain` emits no math scripts.
    html-math-method: plain
    # Off: adds a hover glyph to every heading, and nests an anchor link
    # inside teaser headings that are already links.
    anchor-sections: false
    smooth-scroll: true
    link-external-newwindow: true
    link-external-icon: false
    grid:
      body-width: 1120px
      sidebar-width: 240px
      margin-width: 180px
      gutter-width: 1.5rem
